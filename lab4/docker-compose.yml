version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lab3_rabbitmq
    ports:
      - "5672:5672"      # AMQP порт
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
